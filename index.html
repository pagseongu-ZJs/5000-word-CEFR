 $('#bd').onclick=()=>{ts=new Date().toLocaleString();open(`<h2 style="margin:0">${u('sum')}</h2>${sumHtml(Object.values(ses),ts)}<div class="rw"><button class="bx" onclick="copy(txt(Object.values(ses),'Vocab '+ts))">📋 ${u('copy')}</button><button class="bx" onclick="img()">🖼 ${u('img')}</button><button class="bx" onclick="keep()">⭐ ${u('keep')}</button><button class="bx" onclick="ses=null;xc();render();bind()">${u('cl')}</button></div>`)};
 $('#ba').onclick=()=>{if(!ses)return toast(u('st1'));V.forEach(([l,w,p])=>sel.add(key(l,w,p)));render();bind()};
 $('#bc').onclick=()=>{sel.clear();render();bind()};$('#by').onclick=()=>mark(1);$('#bn').onclick=()=>mark(0);
  $('#bg').onclick=game;$('#bh').onclick=lib;$('#br').onclick=reset}
function reset(){const g={};Object.entries(ST).forEach(([k,v])=>{const o=g[v.d]||(g[v.d]={y:0,n:0});v.s?o.y++:o.n++});const ds=Object.keys(g).sort().reverse();
 open(`<h2 style="margin:0">↺ ${u('rst')}</h2>`+(ds.map(d=>`<div class="hi"><b>${d}</b> ${d==today()?'★':''} · ✓${g[d].y} ✗${g[d].n} <button class="bx" style="float:right;padding:2px 10px" onclick="rd('${d}')">↺</button></div>`).join('')||'<p class="m">—</p>')+`<div class="rw"><button class="bx" onclick="rl()">↺ ${lvl}</button><button class="bx" onclick="xc()">${u('cl')}</button></div>`)}
function rd(d){cf('↺ '+d+'?',()=>{Object.keys(ST).forEach(k=>{if(ST[k].d==d)delete ST[k]});sv2();render()})}
function rl(){cf('↺ '+lvl+'?',()=>{Object.keys(ST).forEach(k=>{if(k.startsWith(lvl+'|'))delete ST[k]});sv2();render()})}
const txt=(L0,t0)=>{const y=L0.filter(x=>x.s),n=L0.filter(x=>!x.s),f=a=>a.map(x=>x.w).join(', ')||'-';return `${t0}\n✅ ${y.length}: ${f(y)}\n❌ ${n.length}: ${f(n)}`};
let ts='';
let CAP;function sumHtml(L0,d){CAP=[L0,d];const y=L0.filter(x=>x.s),n=L0.filter(x=>!x.s),f=a=>a.map(x=>x.w+(mean(key(x.l,x.w,x.p))?' ('+mean(key(x.l,x.w,x.p))+')':'')).join(', ')||'-';return `<div id="cap" style="padding:8px;background:var(--c)"><b>VOCAB ARCHIVE</b> <span class="m">${d}</span><div class="two"><div class="y"><h3>✅ ${u('yes')} ${y.length}</h3><p>${f(y)}</p></div><div class="n"><h3>❌ ${u('no')} ${n.length}</h3><p>${f(n)}</p></div></div></div>`}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast('✓ copied')}
const wrapT=(m,t,w)=>{const o=[];let l='';for(const s of t.split(' ')){const x=l?l+' '+s:s;if(m.measureText(x).width>w&&l){o.push(l);l=s}else l=x}o.push(l);return o};
async function img(){try{const [L0,d]=CAP||[[],''],y=L0.filter(x=>x.s),n=L0.filter(x=>!x.s),f=a=>a.map(x=>{const t=mean(key(x.l,x.w,x.p));return x.w+(t?' ('+t+')':'')}).join(', ')||'-';
 const W=900,P=24,CW=(W-P*3)/2,F='14px "Noto Sans Thai","Noto Sans SC",system-ui,sans-serif',m=document.createElement('canvas').getContext('2d');m.font=F;
 const cols=[['✅ '+u('yes')+' '+y.length,wrapT(m,f(y),CW-20),'#daf3e6'],['❌ '+u('no')+' '+n.length,wrapT(m,f(n),CW-20),'#fbdde0']],RH=Math.max(cols[0][1].length,cols[1][1].length)*20+50,H=56+RH+20;
 const c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#2b2b2e';x.font='bold 18px system-ui,sans-serif';x.fillText('VOCAB ARCHIVE · '+d,P,34);
 cols.forEach((k,i)=>{const X=P+i*(CW+P);x.fillStyle=k[2];x.fillRect(X,50,CW,RH);x.fillStyle='#2b2b2e';x.font='bold 15px system-ui,sans-serif';x.fillText(k[0],X+10,74);x.font=F;k[1].forEach((l,j)=>x.fillText(l,X+10,98+j*20))});
 const fn='vocab-'+today()+'.png',bl=await new Promise(r=>c.toBlob(r,'image/png'));
 try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:fn,data:bl});toast('✓ '+fn);return}catch(e){}
 open(`<p>กดค้างที่รูป (หรือคลิกขวา) เพื่อบันทึก · Long-press / right-click the image to save</p><img src="${c.toDataURL('image/png')}" style="width:100%;border:1px solid var(--ln)"><div class="rw"><button class="bx" onclick="xc()">${u('cl')}</button></div>`)}catch(e){toast('⚠ '+(e&&e.message||e))}}
function keep(){HI.unshift({d:ts,L:Object.values(ses)});sv('ox_hi',HI.slice(0,100));toast('⭐')}
function lib(){open(`<h2 style="margin:0">🗂 ${u('lib')}</h2>`+(HI.map((h,i)=>`<div class="hi"><b>${h.d}</b> · ✅${h.L.filter(x=>x.s).length} ❌${h.L.filter(x=>!x.s).length}<div class="rw"><button class="bx" onclick="hv(${i})">👁</button><button class="bx" onclick="copy(txt(HI[${i}].L,'Vocab '+HI[${i}].d))">📋</button><button class="bx" onclick="HI.splice(${i},1);sv('ox_hi',HI);lib()">🗑</button></div></div>`).join('')||'<p class="m">—</p>')+`<div class="rw"><button class="bx" onclick="xc()">${u('cl')}</button></div>`)}
function hv(i){open(`${sumHtml(HI[i].L,HI[i].d)}<div class="rw"><button class="bx" onclick="img()">🖼 ${u('img')}</button><button class="bx" onclick="lib()">←</button></div>`)}
let Q=[],qi=0,sc=0,miss=[];
async function game(){const pool=D[lvl].map(([w,p])=>[lvl,w,p]).filter(x=>!/[ ,]/.test(x[1]));const f=pool.filter(x=>stv(key(...x))!==1);
 Q=(f.length>=10?f:pool).sort(()=>Math.random()-.5).slice(0,10);qi=0;sc=0;miss=[];open('<p>🌐 …</p>');await trans(Q);ask()}
function ask(){if(qi>=Q.length){open(`<h2>${u('top')} · ${lvl}</h2><div class="big">${sc} / ${Q.length}</div>${miss.length?'<p class="m">✗ '+miss.join(', ')+'</p>':'🎉'}<div class="rw"><button class="bx" onclick="game()">${u('play')}</button><button class="bx" onclick="xc();render();bind()">${u('cl')}</button></div>`);return}
 const [l,w,p]=Q[qi],k=key(l,w,p);open(`<span class="m">${qi+1}/${Q.length} · ${l}</span><div class="big">${mean(k)||'—'}</div><span class="tg">${pn(gp(p))}</span><span class="m">${w.length} · “${w[0]}…”</span><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="fb" style="min-height:22px"></div><div class="rw"><button class="bx" id="ok" style="background:var(--lime);color:#111">OK</button><button class="bx" id="sk">${u('sk')}</button></div>`);
 const a=$('#ans');a.focus();let dn=0;
 const fin=c=>{if(dn){qi++;ask();return}dn=1;ST[k]={s:c?1:0,d:today()};sv2();if(c)sc++;else miss.push(w);$('#fb').innerHTML=c?`<b style="color:var(--g)">✓ ${u('ok')}</b>`:`<b style="color:var(--r)">✗ ${u('ans')}: ${w}</b>`;$('#ok').textContent=u('nx')+' →';$('#sk').style.display='none'};
 $('#ok').onclick=()=>dn?fin():fin(a.value.trim().toLowerCase()==w.toLowerCase());$('#sk').onclick=()=>fin(false);a.onkeydown=e=>{if(e.key=='Enter')$('#ok').click()}}
$('#info').onclick=e=>{const r=e.target.closest('[data-f]');if(!r)return;const f=r.dataset.f;fil=f=='all'||fil==f?'':f;render();const g=$('#gr');g.scrollLeft=0;g.scrollTop=0};
{const gr=$('#gr');let dg=null;gr.addEventListener('pointerdown',e=>{if(e.pointerType=='mouse')dg={x:e.clientX,l:gr.scrollLeft,m:0}});addEventListener('pointermove',e=>{if(!dg)return;const dx=e.clientX-dg.x;if(Math.abs(dx)>6){dg.m=1;gr.style.scrollBehavior='auto';gr.scrollLeft=dg.l-dx}});addEventListener('pointerup',()=>{if(dg){gr.style.scrollBehavior='';if(dg.m){gr.dataset.nc=1;setTimeout(()=>delete gr.dataset.nc,50)}dg=null}})}
$('#tv').onclick=e=>{const b=e.target.closest('[data-t]');if(!b||b.disabled)return;const f=b.dataset.t;TV[f]=TV[f]?0:1;sv('ox_tv',TV);render()};
$('#th').onclick=()=>{THM=THM=='dark'?'light':'dark';sv('ox_theme',THM);render()};
async function autoTr(){const all=Object.keys(D).flatMap(l=>D[l].map(([w,p])=>[l,w,p])),tp=$('#tp'),miss=()=>all.filter(x=>!TR[key(...x)]).length;if(!miss()){tp.textContent='';return}
 let last=0;tp.textContent='🌐 '+Object.keys(TR).length+'/'+TOT;
 for(let p=0;p<5&&miss();p++){await trans(all,()=>{tp.textContent='🌐 '+Object.keys(TR).length+'/'+TOT;if(Date.now()-last>4000){last=Date.now();render()}},4);
  if(trans.fatal){tp.innerHTML='<button class="sw" id="rt">🌐 ↻</button>';$('#rt').onclick=autoTr;return}}
 const l=miss();tp.textContent=l?'⚠ '+l:'';render()}
render();autoTr();
</script></body></html>
